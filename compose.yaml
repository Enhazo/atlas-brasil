services:
  app:
    build: .
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/atlas
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - atlas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  atlas_data:
